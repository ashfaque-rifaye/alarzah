<style>
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,#0d1d22 0%,#05090b 70%);transition:opacity .7s cubic-bezier(.16,1,.3,1),filter .7s,transform .7s}
#splash.out{opacity:0;filter:blur(14px);transform:scale(1.04);pointer-events:none}
#splash .s-in{display:flex;flex-direction:column;align-items:center;gap:18px}
#splash svg{width:84px;height:84px;filter:drop-shadow(0 0 28px rgba(59,232,224,.35))}
#splash svg path{stroke-dasharray:90;stroke-dashoffset:90;animation:sdraw 1.1s cubic-bezier(.65,0,.35,1) forwards}
#splash svg path:nth-child(2){animation-delay:.12s}#splash svg path:nth-child(3){animation-delay:.24s}#splash svg path:nth-child(4){animation-delay:.36s}#splash svg path:nth-child(5){animation-delay:.62s}
#splash .s-word{font:600 26px/1 'Space Grotesk',system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:#eaf2f4;opacity:0;transform:translateY(6px);animation:sup .7s .55s cubic-bezier(.16,1,.3,1) forwards}
#splash .s-sub{font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;color:#7f959c;opacity:0;animation:sup .7s .8s cubic-bezier(.16,1,.3,1) forwards}
#splash .s-bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;opacity:0;animation:sup .5s .9s forwards}
#splash .s-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#3be8e0,#7cf5b8,#ffc15e);border-radius:2px;animation:sbar 1.1s ease-in-out infinite}
@keyframes sdraw{to{stroke-dashoffset:0}}@keyframes sup{to{opacity:1;transform:none}}@keyframes sbar{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#splash svg path,#splash .s-word,#splash .s-sub,#splash .s-bar{animation:none;opacity:1;stroke-dashoffset:0;transform:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="s-in">
<svg viewBox="8 6 48 50"><defs><linearGradient id="sg" gradientUnits="userSpaceOnUse" x1="12" y1="52" x2="52" y2="12"><stop offset="0" stop-color="#3be8e0"/><stop offset=".55" stop-color="#7cf5b8"/><stop offset="1" stop-color="#ffc15e"/></linearGradient></defs><g fill="none" stroke="url(#sg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.0 51 L29.6 12.2 Q32 10.0 34.4 12.2 L51.0 51"/><path d="M17.6 51 L29.6 18.4 Q32 16.2 34.4 18.4 L46.4 51" opacity=".83"/><path d="M22.2 51 L29.6 24.6 Q32 22.4 34.4 24.6 L41.8 51" opacity=".66"/><path d="M26.8 51 L29.6 30.8 Q32 28.6 34.4 30.8 L37.2 51" opacity=".49"/><path d="M20.5 39h23" stroke-width="2.6"/></g></svg>
<div class="s-word">Alarzah</div><div class="s-sub">Men’s health, privately</div><div class="s-bar"><i></i></div></div></div>
<script>
(function(){var q=location.search,el=document.getElementById('splash');if(/[?&](embed|nosplash)=/.test(q)){el.remove();window.__splashDone=function(){};return}
var seen=false;try{seen=sessionStorage.getItem('alz.splash')==='1';sessionStorage.setItem('alz.splash','1')}catch(e){}
var min=seen?650:1700,t0=Date.now(),ready=false;function out(){el.classList.add('out');setTimeout(function(){el.remove()},800)}
window.__splashDone=function(){if(ready)return;ready=true;setTimeout(out,Math.max(0,min-(Date.now()-t0)))};setTimeout(function(){if(!ready)window.__splashDone()},6000)})();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
